[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "maximum-meow"
version = "1.0.0rc3"
description = "Deterministic full-corpus localization overhaul for Ultimate UwU Meowification Nyaa"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
